<div class="app">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="24" height="24" rx="6" fill="#6366f1"/>
        <path d="M7 17L12 7L17 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 13H15" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="navbar-title">AuthAction</span>
    </div>
    <div class="navbar-actions">
      <ng-container *ngIf="(isLoading$ | async) === false">
        <ng-container *ngIf="isAuthenticated$ | async; else guestNav">
          <button class="btn btn-ghost" (click)="logout()">Sign out</button>
        </ng-container>
        <ng-template #guestNav>
          <span class="demo-badge">Demo App</span>
          <button class="btn btn-ghost" (click)="login()">Log in</button>
          <button class="btn btn-primary btn-sm" (click)="signup()">Sign up</button>
        </ng-template>
      </ng-container>
    </div>
  </nav>

  <!-- Loading -->
  <ng-container *ngIf="(isLoading$ | async) !== false">
    <div class="screen-center">
      <div class="spinner"></div>
    </div>
  </ng-container>

  <!-- Authenticated: raw claims -->
  <ng-container *ngIf="(isLoading$ | async) === false && (isAuthenticated$ | async)">
    <main class="claims-main">
      <div class="claims-card">
        <h1 class="claims-title">Raw Claims</h1>
        <pre class="claims-content">{{ (user$ | async) | rawClaims }}</pre>
      </div>
    </main>
  </ng-container>

  <!-- Unauthenticated: landing page -->
  <ng-container *ngIf="(isLoading$ | async) === false && !(isAuthenticated$ | async)">
    <main class="hero">
      <p class="hero-eyebrow">Identity &amp; Access Management</p>
      <h1 class="hero-title">Authentication made simple</h1>
      <p class="hero-subtitle">
        Secure, fast, and developer-friendly OAuth2 authentication for your applications.
      </p>
      <div class="hero-actions">
        <button class="btn btn-primary btn-lg" (click)="signup()">Get started free</button>
        <button class="btn btn-outline btn-lg" (click)="login()">Log in</button>
      </div>
    </main>
  </ng-container>

</div>

<router-outlet />
